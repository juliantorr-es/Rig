name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .[dev]
      - run: find src scripts tests -name "*.py" -print0 | xargs -0 python -m py_compile
      - run: python -m rig --help
      - run: python -m pytest -q
