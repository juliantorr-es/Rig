name: ci

# Rig CI/CD Pipeline
#
# Doctrine:
# - macOS-first (as per Rig doctrine)
# - Deterministic validation ordering
# - Fail-fast behavior
# - No hidden mutation
# - Security-conscious

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions: Minimal required permissions for security
permissions:
  contents: read
  # Note: No write permissions - CI should not modify the repo

jobs:
  check:
    name: Validation
    runs-on: macos-14  # macOS-first as per Rig doctrine
    
    # Timeout: 30 minutes should be plenty for all checks
    timeout-minutes: 30
    
    steps:
      # Step 1: Checkout with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper Git operations
          persist-credentials: false  # Don't persist GitHub token
        id: checkout
      
      # Step 2: Set up Python 3.14
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # Disable caching to ensure clean environment
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
        id: setup-python
      
      # Step 3: Verify Python version
      - name: Verify Python version
        run: |
          python --version
          if [[ ! $(python --version) =~ "3.14" ]]; then
            echo "ERROR: Python 3.14 is required"
            exit 1
          fi
      
      # Step 4: Install with pinned pip version
      - name: Install Rig with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,dev]"
      
      # Step 5: Verify installation
      - name: Verify Rig installation
        run: |
          python -m rig --help > /dev/null
          echo "Rig CLI is functional"
      
      # Step 6: Syntax compilation check
      - name: Syntax compilation check
        run: python3.14 -m compileall -q src tests
      
      # Step 7: Canonical validation (fast mode)
      - name: Run canonical validation
        run: bash scripts/check.sh --fast
      
      # Step 8: Individual test suites (run even if some fail)
      - name: Verify replay tests
        run: python -m pytest tests/test_replay.py -v --tb=short
      
      - name: Verify integrity tests
        run: python -m pytest tests/test_integrity.py -v --tb=short
      
      - name: Verify projection contract tests
        run: python -m pytest tests/test_projection_contracts.py -v --tb=short
      
      - name: Verify UI frontend logic tests
        run: python -m pytest tests/test_ui_frontend_logic.py -v --tb=short
      
      # Step 9: Doctor commands
      - name: Run Rig doctor all
        run: python -m rig doctor all
      
      - name: Run Rig doctor projections
        run: python -m rig doctor projections
      
      # Step 10: Replay validation
      - name: Validate replay timeline
        run: python -m rig replay timeline --json > /tmp/timeline.json && python -m json.tool /tmp/timeline.json > /dev/null
      
      # Step 11: CLI commands validation
      - name: Validate Rig CLI commands
        run: |
          python -m rig --help > /dev/null
          python -m rig ui --help > /dev/null
          python -m rig replay --help > /dev/null
          python -m rig doctor --help > /dev/null
          echo "All CLI commands functional"
      
      # Step 12: UI dry-run validation
      - name: Validate UI dry-run
        run: python -m rig window open --dry-run
      
      # Step 13: Verify environment cleanliness
      - name: Verify no test artifacts remain
        run: |
          # Check that no test files were created in src/
          if [ -n "$(find src -name '*.pyc' -o -name '__pycache__' 2>/dev/null)" ]; then
            echo "WARNING: Test artifacts found in src/"
            find src -name '*.pyc' -o -name '__pycache__'
          fi
          # This is informational, not a failure
      
      # Step 14: Collect validation artifacts (on failure)
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "Collecting diagnostic information..."
          python -m rig doctor all --json > /tmp/doctor.json 2>&1 || true
          python -m rig replay timeline --json > /tmp/timeline.json 2>&1 || true
          python --version > /tmp/python_version.txt 2>&1 || true
          python -m pip list > /tmp/pip_list.txt 2>&1 || true
          echo "Diagnostics collected in /tmp/"
        continue-on-error: true

  # Separate job for full validation (runs on main only)
  full-validation:
    name: Full Validation
    runs-on: macos-14
    needs: check
    if: github.ref == 'refs/heads/main'
    
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      
      - name: Install Rig with all dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,dev,ml]" || python -m pip install -e ".[ui,dev]"
      
      # Run full validation without --fast flag
      - name: Run full canonical validation
        run: bash scripts/check.sh
      
      # Additional validation that's skipped in --fast mode
      - name: Validate UI window open
        run: python -m rig window open --dry-run

  # Security scan job (weekly schedule + on main changes)
  security-scan:
    name: Security Scan
    runs-on: macos-14
    if: github.ref == 'refs/heads/main'
    # Run weekly on main, plus on every push to main
    # Note: This creates a separate workflow for security to run independently
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      - name: Install pip-audit
        run: python -m pip install pip-audit
      
      - name: Run pip-audit for security vulnerabilities
        run: pip-audit --vulnerability-service-uri https://api.osv.dev/v1/query
        continue-on-error: true  # Don't fail CI, just report
      
      - name: List installed dependencies
        run: python -m pip list --format=freeze > /tmp/dependencies.txt && cat /tmp/dependencies.txt

# Operational Trust Verification
# - See .github/workflows/verify-trust.yml for fresh clone and release artifact verification
# - Fresh clone verification: scripts/verify_fresh_clone.sh
# - Release artifact verification: scripts/verify_release_artifacts.sh

# Note on security:
# - No write permissions granted to CI
# - No secrets are used in CI (all open source)
# - pip-audit checks for known vulnerabilities
# - Dependabot handles automatic security PRs (see dependabot.yml)
# - Action pinning: All actions are pinned to specific versions
# - Python version explicitly specified
# - Full history checkout for proper Git operations
# - Operational trust verification in separate workflow (verify-trust.yml)
