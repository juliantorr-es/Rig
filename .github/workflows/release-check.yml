name: release-check
on:
  push:
  pull_request:
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .[dev]
      - run: python -m rig release check --json | tee release-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-check-json
          path: release-check.json
