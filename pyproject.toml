[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rig"
version = "0.1.0a1"
description = "Rig, a repo-local developer control plane for disciplined local automation"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Rig maintainers" }]
dependencies = [
  "jsonschema>=4.23",
  "duckdb>=1.0.0",
  "PyYAML>=6.0",
  "rich>=13.7",
  "textual>=0.76",
  "textual-serve>=1.1.0",
  "pywebview>=5.3",
  "mlx>=0.20; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "llama-cpp-python>=0.3.0",
  "psutil>=5.9",
  "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
rig = "rig.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rig*", "rig_tools*", "anigma_common*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.rig]

[[tool.rig.validators]]
id = "pytest"
argv = ["python", "-m", "pytest", "-q"]
required = true

[tool.rig.policy]
allow_provider_proposals = true
allow_auto_accept_proposals = false
allow_auto_execute = false
allow_auto_validate = true
allow_auto_review = true
allow_auto_apply = false
